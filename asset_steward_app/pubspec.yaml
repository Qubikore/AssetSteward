name: asset_steward_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: ^1.3.0
  gap: ^3.0.1
  hugeicons_pro: ^0.0.3
  flex_color_scheme: ^9.0.0

  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  get_it: ^9.2.1
  injectable: ^3.0.0

  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0

  go_router: ^18.0.1
  dart_mappable: ^4.10.0
  
  intl: ^0.20.3
  fpdart: ^1.2.0
  recase: ^4.1.0
  screwdriver: ^5.12.0
  chirp: ^0.9.0
  chirp_addons: ^0.0.2
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.3.0
  universal_image: ^1.0.12

  cupertino_ui: any
  package_rename: ^1.10.1
  cue: ^0.4.0
  image_picker: ^1.2.3
  flutter_typeahead: ^6.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3
  riverpod_generator: ^4.0.9
  dart_mappable_builder: ^4.10.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-VariableFont.ttf


# dart run package_rename
package_rename_config:
  android:
    app_name: "AssetSteward"
    package_name: "com.qubikore.asset_steward"
